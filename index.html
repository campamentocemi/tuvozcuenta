<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Tu Voz Cuenta</title>

  <link
    rel="icon"
    type="image/png"
    href="./favicon.png"
  >

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {

      --bg: #F5F7FA;
      --surface: #FFFFFF;

      --text: #1F2937;
      --text-light: #6B7280;

      --primary: #0057CC;
      --primary-hover: #003F94;

      --border: #DBE3EC;

      --font-heading: "Manrope", sans-serif;
      --font-body: "Inter", sans-serif;

      --radius: 24px;

      --shadow:
        0 10px 32px rgba(0,0,0,0.08);

      --container: 760px;
    }

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      background:
        radial-gradient(
          circle at top,
          #FFFFFF,
          var(--bg)
        );

      color: var(--text);

      font-family: var(--font-body);

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;
    }

    .container {

      width: 100%;
      max-width: var(--container);

      background: var(--surface);

      border-radius: var(--radius);

      padding: 64px 32px 56px;

      box-shadow: var(--shadow);

      text-align: center;
    }

    h1 {

      margin: 0 0 18px;

      font-family: var(--font-heading);

      font-size: clamp(3.5rem, 9vw, 6rem);

      letter-spacing: -0.07em;

      line-height: 0.92;

      color: #001B4D;
    }

    .subtitle {

      margin: 0 auto 48px;

      max-width: 580px;

      color: var(--text-light);

      font-size: 1.18rem;

      line-height: 1.7;
    }

    .campaigns {

      display: flex;
      flex-direction: column;

      gap: 18px;
    }

    .campaign-button {

      display: flex;
      align-items: center;
      justify-content: space-between;

      width: 100%;

      padding: 24px 28px;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #0057CC,
          #0B63E6
        );

      color: white;

      text-decoration: none;

      font-size: 1.2rem;
      font-weight: 700;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;

      box-shadow:
        0 10px 24px rgba(0,87,204,0.22);
    }

    .campaign-button:hover {

      transform: translateY(-2px);

      background:
        linear-gradient(
          135deg,
          #0048A8,
          #0057CC
        );

      box-shadow:
        0 18px 34px rgba(0,87,204,0.28);
    }

    .campaign-button span:last-child {

      font-size: 1.8rem;

      line-height: 1;
    }

    .footer {

      margin-top: 72px;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 28px;
    }

    .footer-divider {

      width: 100%;
      max-width: 540px;

      height: 1px;

      background:
        linear-gradient(
          to right,
          transparent,
          #DBE3EC,
          transparent
        );
    }

    .footer-logo {

      width: min(420px, 82vw);

      height: auto;

      display: block;

      object-fit: contain;

      margin-top: 6px;
    }

    .socials {

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 18px;
    }

    .social-button {

      width: 62px;
      height: 62px;

      border-radius: 999px;

      background: white;

      color: #0057CC;

      display: flex;
      align-items: center;
      justify-content: center;

      text-decoration: none;

      box-shadow:
        0 10px 22px rgba(0,0,0,0.08);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease,
        color 0.15s ease;
    }

    .social-button:hover {

      transform: translateY(-2px);

      background: #0057CC;

      color: white;

      box-shadow:
        0 18px 34px rgba(0,87,204,0.22);
    }

    .social-button svg {

      width: 28px;
      height: 28px;
    }

    @media (max-width: 640px) {

      .container {

        padding:
          48px 22px 44px;
      }

      .campaign-button {

        padding:
          22px 20px;

        font-size: 1.05rem;
      }

      .campaign-button span:last-child {

        font-size: 1.5rem;
      }

      .footer-logo {

        width: min(360px, 88vw);
      }
    }

  </style>
</head>

<body>

  <main class="container">

    <h1>Tu Voz Cuenta</h1>

    <p class="subtitle">
      Participa en campañas activas y haz escuchar tu voz.
    </p>

    <section class="campaigns">

      <a
        class="campaign-button"
        href="./ley82-2026/"
      >
        <span>Ley 82-2026</span>
        <span>→</span>
      </a>

      <a
        class="campaign-button"
        href="./PS697/"
      >
        <span>PS697</span>
        <span>→</span>
      </a>

      <a
        class="campaign-button"
        href="./camara/"
      >
        <span>Escríbele a la Cámara</span>
        <span>→</span>
      </a>

      <a
        class="campaign-button"
        href="./senado/"
      >
        <span>Escríbele al Senado</span>
        <span>→</span>
      </a>

    </section>

    <footer class="footer">

      <div class="footer-divider"></div>

      <img
        class="footer-logo"
        src="./campamento-cemi-logo.png"
        alt="Campamento CEMI"
      >

      <div class="socials">

        <a
          href="https://www.instagram.com/campamento.cemi.rincon"
          target="_blank"
          aria-label="Instagram"
          class="social-button"
        >
          <svg
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M7 2C4.2 2 2 4.2 2 7v10c0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5V7c0-2.8-2.2-5-5-5H7zm0 2h10c1.7 0 3 1.3 3 3v10c0 1.7-1.3 3-3 3H7c-1.7 0-3-1.3-3-3V7c0-1.7 1.3-3 3-3zm10.5 1a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM12 7a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6z"/>
          </svg>
        </a>

        <a
          href="https://www.facebook.com/people/Campamento-Cem%C3%AD/61576438150730/"
          target="_blank"
          aria-label="Facebook"
          class="social-button"
        >
          <svg
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M13 22v-8h3l1-4h-4V8c0-1.2.3-2 2-2h2V2.5C16.6 2.2 15.4 2 14 2c-3 0-5 1.8-5 5.2V10H6v4h3v8h4z"/>
          </svg>
        </a>

      </div>

    </footer>

  </main>

</body>
</html>
