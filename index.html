<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Tu Voz Cuenta</title>

  <link
    rel="icon"
    type="image/png"
    href="./favicon.png"
  >

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {

      /* COLORS */
      --bg: #F5F7FA;
      --surface: #FFFFFF;

      --text: #1F2937;
      --text-light: #6B7280;

      --primary: #0057CC;
      --primary-hover: #003F94;

      --border: #DBE3EC;

      /* TYPOGRAPHY */
      --font-heading: "Manrope", sans-serif;
      --font-body: "Inter", sans-serif;

      /* LAYOUT */
      --radius: 18px;

      --shadow:
        0 8px 28px rgba(0,0,0,0.08);

      --container: 720px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      background: var(--bg);

      color: var(--text);

      font-family: var(--font-body);

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;
    }

    .container {

      width: 100%;
      max-width: var(--container);

      background: var(--surface);

      border-radius: var(--radius);

      padding: 56px 28px;

      box-shadow: var(--shadow);

      text-align: center;
    }

    h1 {

      margin: 0 0 14px;

      font-family: var(--font-heading);

      font-size: clamp(2.5rem, 7vw, 4.5rem);

      letter-spacing: -0.04em;
    }

    .subtitle {

      margin: 0 auto 42px;

      max-width: 540px;

      color: var(--text-light);

      font-size: 1.1rem;

      line-height: 1.6;
    }

    .campaigns {

      display: flex;
      flex-direction: column;

      gap: 18px;
    }

    .campaign-button {

      display: block;

      width: 100%;

      padding: 22px 24px;

      border-radius: 16px;

      background: var(--primary);

      color: white;

      text-decoration: none;

      font-size: 1.15rem;
      font-weight: 700;

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;

      box-shadow:
        0 6px 18px rgba(0,87,204,0.18);
    }

    .campaign-button:hover {

      background: var(--primary-hover);

      transform: translateY(-2px);

      box-shadow:
        0 12px 28px rgba(0,87,204,0.24);
    }

    footer {

      margin-top: 42px;

      color: var(--text-light);

      font-size: 0.92rem;
    }

    @media (max-width: 640px) {

      .container {

        padding:
          42px 20px;
      }

      .campaign-button {

        padding:
          20px 18px;

        font-size: 1rem;
      }
    }

  </style>
</head>

<body>

  <main class="container">

    <h1>Tu Voz Cuenta</h1>

    <p class="subtitle">
      Participa en campañas activas y haz escuchar tu voz.
    </p>

    <section class="campaigns">

      <a
        class="campaign-button"
        href="./ley82-2026/"
      >
        Ley 82-2026
      </a>

      <a
        class="campaign-button"
        href="./PS697/"
      >
        Cámara de Representantes
      </a>

      <a
        class="campaign-button"
        href="./camara/"
      >
        Senado
      </a>

      <a
        class="campaign-button"
        href="./senado/"
      >
        Ley 82-2026
      </a>
      

    </section>

    <footer>
      Campamento CEMI
    </footer>

  </main>

</body>
</html>
