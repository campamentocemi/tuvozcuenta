<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Tu Voz Cuenta</title>

  <link
    rel="icon"
    type="image/png"
    href="./favicon.png"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #F5F7FA;
      --surface: #FFFFFF;
      --text: #1F2937;
      --text-light: #6B7280;
      --primary: #0057CC;
      --primary-hover: #003F94;
      --border: #DBE3EC;
      --font-heading: "Manrope", sans-serif;
      --font-body: "Inter", sans-serif;
      --radius: 28px;
      --shadow: 0 18px 50px rgba(0, 35, 84, 0.10);
      --container: 720px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top, #FFFFFF 0%, #F5F7FA 45%, #EAF0F7 100%);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: var(--container);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(219, 227, 236, 0.8);
      border-radius: var(--radius);
      padding: clamp(42px, 7vw, 70px) clamp(22px, 5vw, 56px);
      box-shadow: var(--shadow);
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-family: var(--font-heading);
      font-size: clamp(3rem, 8vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      color: #061A40;
    }

    .subtitle {
      margin: 0 auto 44px;
      max-width: 520px;
      color: #4B587C;
      font-size: clamp(1.05rem, 2.8vw, 1.35rem);
      line-height: 1.55;
    }

    .campaigns {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .campaign-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      width: 100%;
      padding: 22px 26px;
      border-radius: 14px;
      background: linear-gradient(135deg, #006BFF, var(--primary));
      color: #FFFFFF;
      text-decoration: none;
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      box-shadow: 0 10px 22px rgba(0, 87, 204, 0.22);
      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    .campaign-button::after {
      content: "->";
      font-size: 1.6rem;
      line-height: 1;
      transition: transform 0.15s ease;
    }

    .campaign-button:hover {
      background: linear-gradient(135deg, #0057CC, var(--primary-hover));
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(0, 87, 204, 0.28);
    }

    .campaign-button:hover::after {
      transform: translateX(4px);
    }

    .footer {
      margin-top: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .footer-divider {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .footer-divider::before,
    .footer-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #CBD5E1;
    }

    .footer-divider span {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--primary);
      display: block;
    }

    .footer-logo {
      width: min(230px, 72vw);
      height: auto;
      display: block;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .social-button {
      width: 54px;
      height: 54px;
      border-radius: 999px;
      background: #FFFFFF;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 22px rgba(0, 35, 84, 0.12);
      text-decoration: none;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease,
        color 0.15s ease;
    }

    .social-button:hover {
      transform: translateY(-2px);
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 16px 30px rgba(0, 87, 204, 0.24);
    }

    .social-button svg {
      width: 25px;
      height: 25px;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px;
        align-items: flex-start;
      }

      .container {
        border-radius: 24px;
      }

      .campaign-button {
        padding: 20px 20px;
      }

      .footer {
        margin-top: 46px;
      }

      .footer-logo {
        width: min(210px, 76vw);
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Tu Voz Cuenta</h1>

    <p class="subtitle">
      Participa en campañas activas y haz escuchar tu voz.
    </p>

    <section class="campaigns">

      <a
        class="campaign-button"
        href="./ley82-2026/"
      >
        Ley 82-2026
      </a>

      <a
        class="campaign-button"
        href="./PS697/"
      >
        PS697
      </a>

      <a
        class="campaign-button"
        href="./camara/"
      >
        Escríbele a la Cámara
      </a>

      <a
        class="campaign-button"
        href="./senado/"
      >
        Escríbele al Senado
      </a>

    </section>

    <footer class="footer">

      <div class="footer-divider">
        <span></span>
      </div>

      <img
        class="footer-logo"
        src="./campamento-cemi-logo.png"
        alt="Campamento CEMI"
      >

      <div class="socials">

        <a
          class="social-button"
          href="https://www.facebook.com/people/Campamento-Cem%C3%AD/61576438150730/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Facebook de Campamento CEMI"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M13 22v-8h3l1-4h-4V8c0-1.2.3-2 2-2h2V2.5C16.6 2.2 15.4 2 14 2c-3 0-5 1.8-5 5.2V10H6v4h3v8h4z"/>
          </svg>
        </a>

        <a
          class="social-button"
          href="https://www.instagram.com/campamento.cemi.rincon"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram de Campamento CEMI"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 2C4.2 2 2 4.2 2 7v10c0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5V7c0-2.8-2.2-5-5-5H7zm0 2h10c1.7 0 3 1.3 3 3v10c0 1.7-1.3 3-3 3H7c-1.7 0-3-1.3-3-3V7c0-1.7 1.3-3 3-3zm10.5 1a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM12 7a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6z"/>
          </svg>
        </a>

      </div>

    </footer>

  </main>

</body>
</html>
